# `just ci` on every push and pull request: the build, the tests (the
# unit tests, the machines, the scenes on Keywork's headless backend, and
# the D-Bus services against a private dbus-daemon), clippy, rustfmt, and
# the shell, Markdown, and justfile lint. Nothing else; a real Wayland
# session, the real portal, and releases run by hand.
#
# Arch Linux, as the user's machine. Rust comes from rustup, at the
# version rust-toolchain.toml names; the crates Cargo fetched and the
# target directory are kept between runs.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: archlinux:base
    defaults:
      run:
        # As an unprivileged user, like an orb.
        shell: runuser -u ci -- bash -eo pipefail {0}
    env:
      MISE_VERSION: 2026.11.6
      CARGO_TERM_COLOR: always
    steps:
      # gcc to link; rustup for Rust; Fontconfig, which Keywork loads, and a
      # monospace font; the Vulkan loader and Mesa's software driver;
      # shared-mime-info for types; dbus for the services tests; poppler's
      # pdftoppm and libarchive's bsdtar, which previews call; tar and gzip,
      # which tests archive with.
      - name: Packages and the ci user
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed \
            git curl xz tar gzip gcc rustup \
            fontconfig ttf-dejavu vulkan-icd-loader vulkan-swrast \
            shared-mime-info dbus poppler libarchive
          useradd -m -u "$(stat -c %u "$GITHUB_WORKSPACE")" ci
          # D-Bus's Peer.GetMachineId reads it; the image has none.
          systemd-machine-id-setup || tr -d - </proc/sys/kernel/random/uuid >/etc/machine-id

      - uses: actions/checkout@v5

      # The tools mise.toml pins, checked against mise.lock, as the orb
      # setup and `just release` install them; and the Rust that
      # rust-toolchain.toml names.
      - name: mise and Rust
        run: |
          curl -fsSL https://mise.run | MISE_VERSION="v$MISE_VERSION" sh
          ~/.local/bin/mise trust -q mise.toml
          ~/.local/bin/mise install
          rustup toolchain install --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            /home/ci/.cargo/registry
            /home/ci/.cargo/git
            target
          key: cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: just ci
        run: ~/.local/bin/mise exec -- just ci
