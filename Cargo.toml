[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
# Keywork is pinned by rev until it is on crates.io.
keywork = { git = "https://tangled.org/rockorager.dev/keywork", rev = "cd0baf64" }
libc = "0.2"
flate2 = "1"
plusthree = "0.1.7"
rustix = { version = "1.1.6", features = ["event", "fs", "process"] }
serde_json = "1"
strider-core = { path = "crates/strider-core" }
strider-machines = { path = "crates/strider-machines" }
