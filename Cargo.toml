[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
# Keywork is pinned by rev until it is on crates.io.
keywork = { git = "https://tangled.org/rockorager.dev/keywork", rev = "af4469fd" }
serde_json = "1"
strider-core = { path = "crates/strider-core" }
